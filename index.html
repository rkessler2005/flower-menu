<!DOCTYPE html>
<html>
<head>
    <title>Becky's Photography</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="home">

    <h1>Becky’s Photography</h1>
    <p class="subtitle">choose a mood</p>

    <div class="flower-menu">
        <a href="pink.html">
            <img src="pinkflower.gif" alt="Pink flower">
        </a>

        <a href="yellow.html">
            <img src="yellowflower.gif" alt="Yellow flower">
        </a>

        <a href="white.html">
            <img src="whiteflower.gif" alt="White flower">
        </a>
    </div>

</body>
</html>
<script>
document.addEventListener("mousemove", function(e) {
    let sparkle = document.createElement("div");
    sparkle.className = "sparkle";

    sparkle.style.left = e.pageX + "px";
    sparkle.style.top = e.pageY + "px";

    document.body.appendChild(sparkle);

    setTimeout(() => {
        sparkle.remove();
    }, 800);
});
</script>
